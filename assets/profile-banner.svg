<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">icedracon — evidence-first security research</title>
  <desc id="desc">A dark technical banner showing the icedracon identity, Windows and identity security focus, and an evidence graph flowing into a verified finding.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="10" x2="1395" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03060C"/>
      <stop offset=".52" stop-color="#071426"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="rail" x1="78" y1="0" x2="1362" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EA8FF"/>
      <stop offset=".5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#55D6BE"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(1135 205) rotate(90) scale(190 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7048E8" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#167EC2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#03060C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8CCBFF" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1440" height="420" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1438" height="418" rx="23" fill="url(#grid)" stroke="#7CCBFF" stroke-opacity=".22"/>
  <path d="M24 3H1416" stroke="url(#rail)" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="1135" cy="205" rx="250" ry="190" fill="url(#aura)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="92" fill="#7DCBFF" font-size="15" font-weight="700" letter-spacing="5">SECURITY RESEARCH  /  OPEN-SOURCE SYSTEMS</text>
    <text x="74" y="190" fill="#F7FAFF" font-size="82" font-weight="800" letter-spacing="-4">ICEDRACON</text>
    <text x="79" y="236" fill="#B7C7D8" font-size="21" font-weight="500" letter-spacing="1.2">WINDOWS IDENTITY · INCIDENT RESPONSE · PURE RUST PROTOCOLS</text>
    <rect x="79" y="268" width="548" height="2" rx="1" fill="url(#rail)" opacity=".8"/>
    <text x="79" y="309" fill="#7E94A9" font-size="16" letter-spacing=".5">From scoped signal to defensible evidence.</text>

    <g font-size="12" font-weight="700" letter-spacing="1.6">
      <rect x="78" y="343" width="112" height="34" rx="7" fill="#2EA8FF" fill-opacity=".10" stroke="#2EA8FF" stroke-opacity=".35"/>
      <text x="101" y="365" fill="#80CCFF">DISCOVER</text>
      <rect x="204" y="343" width="82" height="34" rx="7" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".35"/>
      <text x="225" y="365" fill="#C8B6FF">MAP</text>
      <rect x="300" y="343" width="106" height="34" rx="7" fill="#F7C948" fill-opacity=".09" stroke="#F7C948" stroke-opacity=".35"/>
      <text x="317" y="365" fill="#F8D974">VALIDATE</text>
      <rect x="420" y="343" width="95" height="34" rx="7" fill="#55D6BE" fill-opacity=".09" stroke="#55D6BE" stroke-opacity=".35"/>
      <text x="441" y="365" fill="#80E5CF">REPORT</text>
    </g>
  </g>

  <g transform="translate(865 54)">
    <path d="M32 212C101 159 156 184 217 129C275 77 340 91 449 48" fill="none" stroke="url(#rail)" stroke-width="2.5" stroke-opacity=".8"/>
    <path d="M54 86L145 143L220 95L302 156L382 119" fill="none" stroke="#2EA8FF" stroke-width="1.5" stroke-opacity=".42"/>
    <path d="M54 256L145 198L220 252L302 202L449 244" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-opacity=".42"/>

    <g fill="#071426" stroke-width="2">
      <circle cx="54" cy="86" r="10" stroke="#2EA8FF"/><circle cx="54" cy="256" r="10" stroke="#2EA8FF"/>
      <circle cx="145" cy="143" r="12" stroke="#A78BFA"/><circle cx="145" cy="198" r="9" stroke="#55D6BE"/>
      <circle cx="220" cy="95" r="9" stroke="#55D6BE"/><circle cx="220" cy="252" r="10" stroke="#A78BFA"/>
      <circle cx="302" cy="156" r="12" stroke="#F7C948"/><circle cx="302" cy="202" r="9" stroke="#2EA8FF"/>
      <circle cx="382" cy="119" r="9" stroke="#55D6BE"/><circle cx="449" cy="244" r="10" stroke="#A78BFA"/>
    </g>

    <circle cx="449" cy="48" r="31" fill="#A78BFA" fill-opacity=".13" stroke="#C8B6FF" stroke-width="2"/>
    <circle cx="449" cy="48" r="45" fill="none" stroke="#A78BFA" stroke-opacity=".18"/>
    <circle cx="449" cy="48" r="24" fill="#A78BFA" opacity=".18" filter="url(#glow)"/>
    <path d="M435 54L435 43L443 49L449 38L455 49L463 43L463 54Z" fill="none" stroke="#F4EFFF" stroke-width="2" stroke-linejoin="round"/>

    <g transform="translate(330 274)" font-family="Arial, Helvetica, sans-serif">
      <rect width="180" height="64" rx="11" fill="#081522" stroke="#55D6BE" stroke-opacity=".48"/>
      <circle cx="25" cy="24" r="7" fill="#55D6BE"/>
      <path d="M21 24L24 27L30 20" fill="none" stroke="#03110D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="43" y="29" fill="#DDFCF4" font-size="13" font-weight="700" letter-spacing="1">EVIDENCE</text>
      <text x="18" y="49" fill="#6F948B" font-size="10" letter-spacing="1.1">SUPPORTED FINDING</text>
    </g>
  </g>
